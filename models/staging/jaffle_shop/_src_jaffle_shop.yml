version: 2

sources:
  - name: jaffle_shop
    database: dbt-tutorial
    tables:
      - name: customers
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: orders
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
        freshness:
            warn_after:
              count: 1
              period: day
            error_after: 
              count: 3
              period: day
        loaded_at_field: _etl_loaded_at