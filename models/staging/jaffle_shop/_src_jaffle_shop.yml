version: 2

sources:
  - name: jaffle_shop
    database: dbt-tutorial
    schema: jaffle_shop
    description: A clone of Postgres application database
    tables:
      - name: customers
        description: Raw customer data
        columns:
          - name: id
            description: Primary key for customer data
            data_tests:
              - unique
              - not_null
      - name: orders
        description: Raw orders data
        columns:
          - name: id
            description: Primary key for orders data
            data_tests:
              - unique
              - not_null
        freshness:
            warn_after:
              count: 1
              period: day
            error_after: 
              count: 3
              period: day
        loaded_at_field: _etl_loaded_at